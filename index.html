<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShoulderCut — Montez à voix haute</title>
  </head>
  <body data-ui="idle">
    <main id="app">
      <header class="topbar">
        <a class="brand" href="/" aria-label="ShoulderCut, accueil"
          ><svg viewBox="0 0 28 28" aria-hidden="true">
            <path d="M6 7h7l-4 14H2L6 7Zm13 0h7l-4 14h-7l4-14Z" /></svg
          >ShoulderCut<span>avec Muse</span></a
        >
        <div class="topbar-actions">
          <label class="file-button"
            ><input
              id="fileInput"
              type="file"
              accept="video/*,.mkv,.mov,.mp4,.webm"
              hidden
            />＋ Importer</label
          ><button id="exportBtn" class="primary" type="button" disabled>
            Exporter ↗
          </button>
          <details class="settings">
            <summary
              aria-label="Options audio et export"
              title="Options audio et export"
            >
              ☷
            </summary>
            <div class="settings-panel">
              <label for="micSelect">Microphone</label
              ><select id="micSelect" aria-label="Microphone"></select
              ><label for="exportPreset">Format d’export</label
              ><select id="exportPreset">
                <option value="1080p">1080p · original</option>
                <option value="vertical-1080x1920">1080p · vertical</option>
                <option value="square">1080p · carré</option></select
              ><button id="pttBtn" type="button">
                Enregistrer une seule instruction
              </button>
            </div>
          </details>
        </div>
      </header>
      <section class="workspace" aria-label="Votre montage">
        <div class="video-heading">
          <span id="clipTitle">Votre vidéo</span><span id="projectStatus"></span
          ><span id="exportStatus" role="status"></span>
        </div>
        <section id="stage" class="stage" aria-label="Aperçu vidéo">
          <canvas id="preview" width="1280" height="720"></canvas
          ><canvas
            id="selectionCanvas"
            width="1280"
            height="720"
            class="selection-canvas hidden"
            aria-hidden="true"
          ></canvas>
          <div id="selectionBadge" class="selection-badge hidden">
            <span id="selectionLabel">Détourage</span
            ><button
              id="dismissSelection"
              type="button"
              aria-label="Fermer l’aperçu du détourage"
            >
              ×
            </button>
          </div>
          <div id="workTrail" class="work-trail" aria-live="polite"></div>
          <div id="captionOverlay" class="caption-overlay hidden"></div>
          <div id="emptyState" class="empty">
            <span class="empty-symbol" aria-hidden="true">↗</span>
            <h1>Votre idée. Votre voix. Votre montage.</h1>
            <p>Importez une vidéo, puis dites à Muse ce que vous imaginez.</p>
            <button type="button" id="emptyImport">Choisir une vidéo</button
            ><span class="empty-hint">ou glissez-la ici</span>
          </div>
          <div id="dropHint" class="drop-hint hidden">
            Déposez votre vidéo ici
          </div>
        </section>
        <div class="playback" aria-label="Lecture vidéo">
          <button
            id="playPauseBtn"
            class="icon-button"
            type="button"
            aria-label="Lire"
            title="Lire"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path id="playIcon" d="m9 5 11 7-11 7Z" />
            </svg></button
          ><span id="currentTime" class="time">0:00</span
          ><input
            id="timeline"
            type="range"
            min="0"
            max="0"
            step="0.001"
            value="0"
            aria-label="Position dans la vidéo"
            disabled
          /><span id="durationTime" class="time">0:00</span>
          <div class="history-actions">
            <button
              id="undoBtn"
              class="icon-button"
              type="button"
              aria-label="Annuler le montage"
              title="Annuler"
            >
              ↶</button
            ><button
              id="redoBtn"
              class="icon-button"
              type="button"
              aria-label="Rétablir le montage"
              title="Rétablir"
            >
              ↷
            </button>
          </div>
        </div>
        <div
          id="clipList"
          class="clip-list"
          aria-label="Plans du montage"
        ></div>
      </section>
      <section class="conversation" aria-label="Parlez à votre monteur">
        <div class="muse" aria-hidden="true">
          <canvas id="museCanvas"></canvas>
        </div>
        <div class="dock">
          <div class="reply-header">
            <span class="muse-name">Muse</span
            ><span id="agentStatus" class="agent-status" role="status"
              >À votre écoute</span
            >
            <details class="conversation-history">
              <summary
                aria-label="Historique de la conversation"
                title="Historique"
              >
                ↗
              </summary>
              <div id="chatLog" class="chat-log" role="log"></div>
            </details>
          </div>
          <p id="replyLine" class="reply-line" aria-live="polite">
            Qu’est-ce qu’on crée ensemble ?
          </p>
          <form id="chatForm" class="chat-form">
            <input
              id="chatInput"
              type="text"
              autocomplete="off"
              aria-label="Instruction à Muse"
              placeholder="Détoure le personnage, montre-moi le moment où…"
            /><button
              id="chatSendBtn"
              class="send-button"
              type="submit"
              aria-label="Envoyer l’instruction"
              title="Envoyer"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5m-6 6 6-6 6 6" />
              </svg></button
            ><button
              id="voiceBtn"
              class="talk"
              type="button"
              aria-pressed="false"
              title="Ouvrir la conversation vocale"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="3" width="6" height="12" rx="3" />
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg
              ><span class="talk-label">Parler</span>
            </button>
          </form>
          <div class="conversation-foot">
            <span id="voiceStatus" role="status"
              >Un clic sur le micro, puis parlez librement.</span
            >
          </div>
          <p id="errorText" class="error" role="alert"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
