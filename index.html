<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShoulderCut — Edit out loud</title>
  </head>
  <body data-ui="idle">
    <main id="app">
      <header class="topbar">
        <a class="brand" href="/" aria-label="ShoulderCut, home"
          ><svg viewBox="0 0 28 28" aria-hidden="true">
            <path d="M6 7h7l-4 14H2L6 7Zm13 0h7l-4 14h-7l4-14Z" /></svg
          >ShoulderCut<span>with Muse</span></a
        >
        <div class="topbar-actions">
          <label class="file-button"
            ><input
              id="fileInput"
              type="file"
              accept="video/*,.mkv,.mov,.mp4,.webm"
              hidden
            />+ Import</label
          ><button id="exportBtn" class="primary" type="button" disabled>
            Export ↗
          </button>
          <details class="settings">
            <summary
              aria-label="Audio and export options"
              title="Audio and export options"
            >
              ☷
            </summary>
            <div class="settings-panel">
              <label for="micSelect">Microphone</label
              ><select id="micSelect" aria-label="Microphone"></select
              ><label for="exportPreset">Export format</label
              ><select id="exportPreset">
                <option value="1080p">1080p · original</option>
                <option value="vertical-1080x1920">1080p · vertical</option>
                <option value="square">1080p · square</option></select
              ><button id="pttBtn" type="button">
                Record a single instruction
              </button>
            </div>
          </details>
        </div>
      </header>
      <section class="workspace" aria-label="Your montage">
        <div class="video-heading">
          <span id="clipTitle">Your video</span><span id="projectStatus"></span
          ><span id="exportStatus" role="status"></span>
        </div>
        <section id="stage" class="stage" aria-label="Video preview">
          <canvas id="preview" width="1280" height="720"></canvas
          ><canvas
            id="selectionCanvas"
            width="1280"
            height="720"
            class="selection-canvas hidden"
            aria-hidden="true"
          ></canvas>
          <div id="selectionBadge" class="selection-badge hidden">
            <span id="selectionLabel">Cutout</span
            ><button
              id="dismissSelection"
              type="button"
              aria-label="Close the cutout preview"
            >
              ×
            </button>
          </div>
          <div id="workTrail" class="work-trail" aria-live="polite"></div>
          <div id="captionOverlay" class="caption-overlay hidden"></div>
          <div id="emptyState" class="empty">
            <span class="empty-symbol" aria-hidden="true">↗</span>
            <h1>Your idea. Your voice. Your cut.</h1>
            <p>Import a video, then tell Muse what you have in mind.</p>
            <button type="button" id="emptyImport">Choose a video</button
            ><span class="empty-hint">or drop it here</span>
          </div>
          <div id="dropHint" class="drop-hint hidden">Drop your video here</div>
        </section>
        <div class="playback" aria-label="Video playback">
          <button
            id="playPauseBtn"
            class="icon-button"
            type="button"
            aria-label="Play"
            title="Play"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path id="playIcon" d="m9 5 11 7-11 7Z" />
            </svg></button
          ><span id="currentTime" class="time">0:00</span
          ><input
            id="timeline"
            type="range"
            min="0"
            max="0"
            step="0.001"
            value="0"
            aria-label="Position in the shot"
            disabled
          /><span id="durationTime" class="time">0:00</span
          ><button
            id="shotsBtn"
            class="shots-button"
            type="button"
            popovertarget="clipList"
            hidden
          >
            Shots
          </button>
          <div class="history-actions">
            <button
              id="undoBtn"
              class="icon-button"
              type="button"
              aria-label="Undo the edit"
              title="Undo"
            >
              ↶</button
            ><button
              id="redoBtn"
              class="icon-button"
              type="button"
              aria-label="Redo the edit"
              title="Redo"
            >
              ↷
            </button>
          </div>
        </div>
        <!-- Outside .playback: the transport fades out when nobody is
             pointing at it, and pointer-events are inherited, so a panel
             living inside it would be unclickable the moment it opened. -->
        <div
          id="clipList"
          class="clip-list"
          popover
          role="group"
          aria-label="Shots in the montage"
        ></div>
      </section>
      <section class="conversation" aria-label="Talk to your editor">
        <div class="muse" aria-hidden="true">
          <canvas id="museCanvas"></canvas>
        </div>
        <div class="dock">
          <div class="reply-header">
            <span class="muse-name">Muse</span
            ><span id="agentStatus" class="agent-status" role="status"
              >Listening</span
            >
            <details class="conversation-history">
              <summary aria-label="Conversation history" title="History">
                ↗
              </summary>
              <div id="chatLog" class="chat-log" role="log"></div>
            </details>
          </div>
          <p id="replyLine" class="reply-line" aria-live="polite">
            What are we making?
          </p>
          <form id="chatForm" class="chat-form">
            <input
              id="chatInput"
              type="text"
              autocomplete="off"
              aria-label="Instruction for Muse"
              placeholder="Cut out the subject, show me the moment when…"
            /><button
              id="chatSendBtn"
              class="send-button"
              type="submit"
              aria-label="Send the instruction"
              title="Send"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5m-6 6 6-6 6 6" />
              </svg></button
            ><button
              id="voiceBtn"
              class="talk"
              type="button"
              aria-pressed="false"
              title="Open the voice conversation"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="3" width="6" height="12" rx="3" />
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg
              ><span class="talk-label">Talk</span>
            </button>
          </form>
          <div class="conversation-foot">
            <span id="voiceStatus" role="status"
              >Click the mic, then just talk.</span
            >
          </div>
          <p id="errorText" class="error" role="alert"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
